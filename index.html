<meta name="theme-color" content="#2f7d3a">
<style>
  :root{
    --bg:#eef5ec; --card:#ffffff; --ink:#1f2a1f; --sub:#5b6b5b;
    --green:#2f7d3a; --green2:#e3f1e1; --flag:#d6453d; --flag2:#fbe7e5; --line:#d5e2d2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141a14; --card:#1e261e; --ink:#e6eee5; --sub:#9db09b;
      --green:#5fbf6c; --green2:#22331f; --flag:#ef7a72; --flag2:#3a2321; --line:#2f3b2e; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Apple SD Gothic Neo","Malgun Gothic","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;display:flex;flex-direction:column;height:100dvh}
  button,a.btn{font:inherit;font-size:.85rem;border-radius:9px;padding:5px 12px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;white-space:nowrap}
  button:hover:not(:disabled){filter:brightness(.95)}
  button:disabled{opacity:.4;cursor:default}
  [hidden]{display:none !important}

  /* ── 挑戦状の帯 ── */
  #chBar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 12px 0;padding:8px 14px;
    border-radius:12px;background:#fff4d6;color:#5a4300;border:1px solid #f0d58a;font-size:.88rem}
  #chBar b{font-size:1rem}
  #chBar .chRules{opacity:.8;font-size:.8rem}
  #chBar button{margin-left:auto}
  @media (prefers-color-scheme: dark){ #chBar{background:#3a3115;color:#f3dc9b;border-color:#5c4c1d} }

  /* ── 上：お題 ── */
  #odai{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px 12px 6px;flex:none}
  .arrow{display:flex;align-items:center;color:var(--sub);font-size:1.4rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
    display:flex;gap:10px;align-items:flex-start;min-width:0}
  .card img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg)}
  .card .body{min-width:0;flex:1}
  .tag{font-weight:700;font-size:.75rem;padding:1px 10px;border-radius:999px;display:inline-block;white-space:nowrap}
  .start .tag{background:var(--green2);color:var(--green)}
  .goal .tag{background:var(--flag2);color:var(--flag)}
  .meta{font-size:.72rem;color:var(--sub);margin-left:6px}
  .card .title{font-weight:700;font-size:1.08rem;margin:2px 0;word-break:break-word;cursor:pointer;
    text-decoration:underline dotted var(--sub);text-underline-offset:4px}
  .card .title.plain{cursor:default;text-decoration:none}
  .card .extract{color:var(--sub);font-size:.8rem;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .loading{opacity:.45;pointer-events:none}

  /* ── 真ん中：打数・時間・道のり ── */
  #bar{flex:none;display:flex;align-items:center;gap:12px;padding:8px 12px;margin:0 12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px}
  .stat{flex:none;text-align:center;min-width:64px}
  .stat .num{font-size:1.9rem;font-weight:800;line-height:1}
  #clockNum{font-size:1.25rem;font-variant-numeric:tabular-nums}
  #clockNum.warn{color:var(--flag)}
  .stat .lbl{font-size:.7rem;color:var(--sub);white-space:nowrap}
  #route{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:.85rem;color:var(--sub);
    padding:4px 0;scrollbar-width:thin}
  #route .step{color:var(--ink)}
  #route .step.back{color:var(--sub);font-style:italic}
  #route .sep{margin:0 6px;color:var(--sub)}
  #barBtns{flex:none;display:flex;gap:6px}
  #bar{position:relative}
  #ver{position:absolute;right:10px;bottom:1px;font-size:.6rem;color:var(--sub);opacity:.7;pointer-events:none;letter-spacing:.03em}
  #teeoff{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
  #gearBtn{font-size:1.05rem;padding:3px 10px}
  #menuBtn,#findToggle{display:none;font-size:1.05rem;padding:3px 11px}

  /* メニュー（スマホ） */
  #menuPop{position:fixed;z-index:26;background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:190px}
  #menuPop button{border:0;text-align:left;padding:10px 12px;font-size:.95rem;background:transparent}

  /* ── 下：記事の窓 ── */
  #viewerWrap{flex:1;min-height:0;margin:8px 12px 12px;border:1px solid var(--line);border-radius:12px;
    overflow:hidden;position:relative;background:#fff;display:flex;flex-direction:column}
  #findbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;background:#f8f9fa;
    border-bottom:1px solid #c8ccd1;color:#202122;font-size:.85rem}
  #findbar input[type=search]{font:inherit;padding:4px 8px;border:1px solid #a2a9b1;border-radius:4px;width:220px;max-width:40vw;background:#fff;color:#202122}
  #findbar button{background:#fff;color:#202122;border-color:#a2a9b1;padding:3px 9px;border-radius:4px}
  #findbar label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
  #sCount{color:#54595d;min-width:48px;white-space:nowrap}
  #frame{flex:1;width:100%;border:0;display:block;transition:opacity .15s;min-height:0}
  #frame.busy{opacity:.35}
  #placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    color:var(--sub);background:var(--card);padding:16px}

  /* ── プレビュー ── */
  #pop{position:fixed;z-index:25;width:340px;max-width:calc(100vw - 24px);background:#fff;color:#202122;
    border-radius:2px;box-shadow:0 30px 90px -20px rgba(0,0,0,.3),0 0 1px 1px rgba(0,0,0,.05);
    font-family:sans-serif;font-size:14px;line-height:1.6;overflow:hidden;pointer-events:none}
  #pop img{display:block;width:100%;max-height:200px;object-fit:cover}
  #pop .ptext{padding:16px 16px 8px}
  #pop .pfoot{padding:6px 16px 12px;font-size:12px;color:#72777d}

  /* ── モーダル ── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
  .overlay.show{display:flex}
  #reader .panel{background:#fff;width:min(1100px,100%);height:min(88vh,100%);border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column}
  #reader .rhead{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;
    background:#f8f9fa;border-bottom:1px solid #c8ccd1;color:#202122;font-size:.85rem}
  #reader .rhead button{background:#fff;color:#202122;border-color:#a2a9b1}
  #readerFrame{flex:1;border:0;width:100%}

  #settings .panel{background:var(--card);border-radius:14px;padding:18px 20px;width:min(540px,100%);max-height:90vh;overflow-y:auto}
  #settings h2{margin:0 0 4px;font-size:1.2rem}
  #settings .lockNote{font-size:.8rem;color:var(--flag);margin:0 0 6px}
  .srow{padding:10px 0;border-bottom:1px solid var(--line)}
  .srow .slabel{font-weight:700;font-size:.9rem}
  .srow .snote{font-size:.75rem;color:var(--sub)}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .seg button.withDesc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;white-space:normal;line-height:1.35;padding:6px 12px}
  .seg button.withDesc small{font-size:.7rem;opacity:.8;margin-top:1px}
  .seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .srow.locked .seg{opacity:.45;pointer-events:none}
  .shead{font-size:.75rem;color:var(--sub);margin:14px 0 0;letter-spacing:.08em}
  #settings .quit{margin:2px 0 6px;border-color:var(--flag);color:var(--flag);font-weight:700}
  #settings .close{display:block;margin:14px 0 0 auto}

  #qrModal{z-index:35}
  #savedModal{z-index:33}
  #qrModal .panel{background:var(--card);border-radius:16px;padding:20px;width:min(380px,100%);text-align:center;max-height:92vh;overflow-y:auto}
  #qrModal h3{margin:0 0 4px;font-size:1.05rem}
  #qrModal .qsub{font-size:.85rem;color:var(--sub);word-break:break-word}
  #qrBox{background:#fff;border-radius:12px;padding:12px;margin:12px auto;width:fit-content}
  #qrBox canvas{display:block;width:min(260px,70vw);height:auto;image-rendering:pixelated}
  #qrUrl{font-size:.7rem;color:var(--sub);word-break:break-all;max-height:3.2em;overflow:hidden;margin:4px 0 10px}
  #qrWarn{font-size:.78rem;color:var(--flag);margin:0 0 8px}
  #qrModal .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  /* 保存したお題 */
  #savedModal .panel{background:var(--card);border-radius:14px;padding:18px 20px;width:min(640px,100%);max-height:90vh;overflow-y:auto}
  #savedModal h2{margin:0 0 6px;font-size:1.2rem}
  #savedEmpty{font-size:.85rem;color:var(--sub)}
  .sv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  .svTop{display:flex;gap:10px;align-items:center}
  .svHead{flex:1;min-width:0;cursor:pointer}
  .svTitle{font-weight:700;word-break:break-word}
  .svMeta{font-size:.76rem;color:var(--sub)}
  .svBtns{display:flex;gap:6px;flex:none}
  .svPlays{margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}
  .svPlay{font-size:.82rem;padding:6px 0;border-bottom:1px dotted var(--line)}
  .svPlay:last-child{border-bottom:0}
  .svPlay .when{color:var(--sub);font-size:.74rem}
  .svPlay .sc{font-weight:700;margin-left:6px}
  .svPlay .rt{word-break:break-word}
  .svPlay .rt .b{color:var(--sub);font-style:italic}
  .svFoot{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
  #clearAll{border-color:var(--flag);color:var(--flag)}
  #saveRecord:disabled{opacity:.7}
  @media (max-width:720px){ .svTop{flex-wrap:wrap} .svBtns{width:100%;justify-content:flex-end} }

  /* トースト */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:8px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;
    max-width:calc(100vw - 32px);text-align:center}
  #toast.show{opacity:.92}

  /* カップイン */
  #win .box{background:var(--card);border-radius:16px;padding:22px 24px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto}
  #win .whead{text-align:center;font-size:1.1rem;font-weight:800;color:var(--sub);letter-spacing:.05em}
  #win .sg{display:flex;align-items:center;gap:12px;margin:10px 0}
  #win .sg .tag{font-size:.85rem;padding:3px 12px;flex:none}
  #win .sg .big{font-size:1.6rem;font-weight:800;line-height:1.3;word-break:break-word}
  #win .down{text-align:left;color:var(--sub);margin:-6px 0 -6px 30px}
  #win .score{text-align:center;margin:12px 0 4px}
  #win .score .n{font-size:3.6rem;font-weight:900;line-height:1}
  #win .score .u{font-size:1.4rem;font-weight:800;margin-left:4px}
  #win .score .sub{display:block;color:var(--sub);font-size:.9rem;margin-top:4px}
  #win .vs{text-align:center;font-weight:700;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--bg)}
  #win .vs .win{color:var(--green)}
  #win .vs .lose{color:var(--flag)}
  #win .path{font-size:.85rem;background:var(--bg);border-radius:10px;padding:10px 12px;
    max-height:180px;overflow-y:auto;word-break:break-word;margin-top:10px}
  #win .path .sep{color:var(--sub)}
  #win .path .back{color:var(--sub);font-style:italic}
  #win .rules{font-size:.75rem;color:var(--sub);margin-top:8px}
  #win .nameRow{margin-top:14px;font-size:.85rem;color:var(--sub);text-align:center}
  #win .nameRow input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:180px}
  #win .btns{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  #win .btns .prime{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}

  /* ── スマホ ── */
  @media (max-width:720px){
    #chBar{margin:8px 8px 0;padding:6px 10px;font-size:.8rem}
    #chBar b{font-size:.88rem}
    #chBar .chRules{display:block;width:100%}
    #chBar button{margin-left:0;font-size:.78rem}
    #odai{grid-template-columns:1fr;gap:6px;padding:8px 8px 6px}
    .arrow{display:none}
    .card .extract{display:none}
    .card img{width:40px;height:40px}
    body.playing #odai{grid-template-columns:1fr 1fr}
    body.playing .card{padding:5px 9px;gap:6px}
    body.playing .card img, body.playing .card .btns, body.playing .card .meta{display:none !important}
    body.playing .card .tag{font-size:.62rem;padding:0 8px}
    body.playing .card .title{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;text-decoration:none}
    body.collapsed #odai, body.collapsed #chBar{display:none !important}
    #bar{margin:0 8px;padding:6px 8px;gap:8px}
    .stat{min-width:38px}
    .stat .num{font-size:1.45rem}
    #clockNum{font-size:1rem}
    .stat .lbl{font-size:.62rem}
    #route{font-size:.78rem}
    #barBtns > button{display:none}
    #barBtns > #teeoff:not([hidden]), #barBtns > #menuBtn{display:inline-block}
    body.playing #barBtns > #findToggle:not([hidden]){display:inline-block}
    #viewerWrap{margin:6px 8px 8px;border-radius:10px}
    #findbar:not(.open){display:none}
    #findbar input[type=search]{flex:1;width:auto;max-width:none;min-width:0;font-size:16px}
    #findbar label{font-size:.75rem}
    .overlay{padding:10px}
    #reader .panel{height:100%}
    #win .box{padding:18px 16px}
    #win .sg .big{font-size:1.3rem}
    #win .score .n{font-size:3rem}
    #win .nameRow input{font-size:16px}
  }
</style>
</head>
<body>

<div id="chBar" hidden>
  <span id="chText"></span>
  <button id="chExit" data-t="exitCh"></button>
</div>

<section id="odai">
  <div class="card start" id="start">
    <img alt="" hidden>
    <div class="body">
      <span class="tag" data-t="start"></span><span class="meta"></span>
      <div class="title">…</div>
      <p class="extract"></p>
      <div class="btns"><button class="reroll" data-t="reroll"></button><button class="readFull" data-t="readFull"></button></div>
    </div>
  </div>
  <div class="arrow">➜</div>
  <div class="card goal" id="goal">
    <img alt="" hidden>
    <div class="body">
      <span class="tag" data-t="goal"></span><span class="meta"></span>
      <div class="title">…</div>
      <p class="extract"></p>
      <div class="btns"><button class="reroll" data-t="reroll"></button><button class="readFull" data-t="readFull"></button></div>
    </div>
  </div>
</section>

<section id="bar">
  <div class="stat"><div class="num" id="strokeNum">0</div><div class="lbl" data-t="strokes"></div></div>
  <div class="stat"><div class="num" id="clockNum">0:00</div><div class="lbl" id="clockLbl"></div></div>
  <div id="route"></div>
  <span id="ver">v0.8.2</span>
  <div id="barBtns">
    <button id="teeoff" disabled data-t="teeoff"></button>
    <button id="backBtn" hidden data-t="back"></button>
    <button id="newBtn" data-t="newOdai"></button>
    <button id="saveOdai" disabled data-t="saveOdai"></button>
    <button id="savedBtn">📁</button>
    <button id="shareOdai" disabled data-t="share"></button>
    <button id="gearBtn">⚙️</button>
    <button id="findToggle" hidden>🔍</button>
    <button id="menuBtn">⋯</button>
  </div>
</section>

<div id="menuPop" hidden>
  <button data-for="backBtn" data-t="back"></button>
  <button data-for="newBtn" data-t="newOdai"></button>
  <button data-for="saveOdai" data-t="saveOdai"></button>
  <button data-for="savedBtn" data-t="savedList"></button>
  <button data-for="shareOdai" data-t="share"></button>
  <button data-for="gearBtn" data-t="settings"></button>
</div>

<section id="viewerWrap">
  <div id="findbar" hidden>
    <input type="search" id="sInput">
    <button id="sPrev">▲</button>
    <button id="sNext">▼</button>
    <span id="sCount"></span>
    <label><input type="checkbox" id="linkOnly"><span data-t="linkOnly"></span></label>
  </div>
  <iframe id="frame" title="article"></iframe>
  <div id="placeholder" data-t-html="placeholder"></div>
</section>

<div id="pop" hidden></div>

<div id="reader" class="overlay">
  <div class="panel">
    <div class="rhead"><span id="readerNote"></span><button id="readerClose" data-t="close"></button></div>
    <iframe id="readerFrame" title="full text"></iframe>
  </div>
</div>

<div id="settings" class="overlay">
  <div class="panel">
    <h2><span data-t="settings"></span> <small style="font-size:.65rem;font-weight:400;color:var(--sub)">v0.8.2</small></h2>
    <p class="lockNote" id="lockNote" hidden></p>
    <button id="quitHole" class="quit" hidden></button>
    <div id="settingRows"></div>
    <button class="close" id="settingsClose" data-t="closeBtn"></button>
  </div>
</div>

<div id="qrModal" class="overlay">
  <div class="panel">
    <h3 id="qrTitle"></h3>
    <div class="qsub" id="qrSub"></div>
    <div id="qrBox"></div>
    <div class="qsub" data-t="qrHint"></div>
    <div id="qrUrl"></div>
    <p id="qrWarn" hidden data-t="fileWarn"></p>
    <div class="btns">
      <button id="qrCopy" data-t="copy"></button>
      <button id="qrSend" data-t="sendLink"></button>
      <button id="qrClose" data-t="closeBtn"></button>
    </div>
  </div>
</div>

<div id="savedModal" class="overlay">
  <div class="panel">
    <h2 data-t="savedList"></h2>
    <p id="savedEmpty" data-t="emptySaved"></p>
    <div id="savedRows"></div>
    <div class="svFoot"><button id="clearAll" data-t="clearAll"></button><button id="savedClose" data-t="closeBtn"></button></div>
  </div>
</div>

<div id="toast"></div>

<div id="win" class="overlay">
  <div class="box">
    <div class="whead" id="winHead"></div>
    <div class="sg"><span class="tag" style="background:var(--green2);color:var(--green)" data-t="start"></span><span class="big" id="winStart"></span></div>
    <div class="down">↓</div>
    <div class="sg"><span class="tag" style="background:var(--flag2);color:var(--flag)" data-t="goal"></span><span class="big" id="winGoal"></span></div>
    <div class="score"><span class="n" id="winN"></span><span class="u" id="winU"></span><span class="sub" id="winSub"></span></div>
    <div class="vs" id="winVs" hidden></div>
    <div class="path" id="winPath"></div>
    <div class="rules" id="winRules"></div>
    <div class="nameRow" id="nameRow"><span data-t="nameLbl"></span> <input id="myName" maxlength="20"></div>
    <div class="btns">
      <button id="saveRecord" data-t="saveRecord"></button>
      <button id="sendChallenge" data-t="sendCh"></button>
      <button id="saveImg" data-t="saveImg"></button>
      <button id="shareImg" data-t="shareImg"></button>
      <button id="winClose" data-t="keep"></button>
      <button id="winNew" class="prime" data-t="next"></button>
    </div>
  </div>
</div>

/* ════════ 設定 ════════ */
function browserLang(){
  for(const l of (navigator.languages || [navigator.language || "en"])){
    const b = String(l).toLowerCase().split("-")[0];
    if(WIKIS[b]) return b;
  }
  return "en";
}
const DEFAULTS = {lang:browserLang(), zhVariant:"auto", difficulty:"normal", allowCategory:true, allowBack:true,
                  allowSearch:true, timeLimit:0, goalView:"full", shape:"wide", routeImg:"hide"};
const RULE_KEYS = ["lang","difficulty","allowCategory","allowBack","allowSearch","timeLimit","goalView"];

let settings = {...DEFAULTS};
try{ Object.assign(settings, JSON.parse(localStorage.getItem("wikiGolfSettings") || "{}")); }catch(e){}
if(!WIKIS[settings.lang]) settings.lang = DEFAULTS.lang;
function saveSettings(){ try{ localStorage.setItem("wikiGolfSettings", JSON.stringify(settings)); }catch(e){} }

const state = {
  start:null, goal:null, playing:false, busy:false,
  strokes:0, stack:[], route:[], rules:null,
  t0:0, elapsed:0, timer:null, result:null,
  challenge:null,             // {start, goal, rules, name, strokes, time}
  ns:{},                      // 言語ごとの名前空間 {lang: Map}
  parsedCache:new Map()
};

/* いま効いているルール（挑戦状のときはリンクのルールが上書き） */
function eff(){ return state.challenge ? {...settings, ...state.challenge.rules} : settings; }
function curLang(){ return (state.playing && state.rules ? state.rules.lang : eff().lang); }
function zhVariant(){
  if(settings.zhVariant === "zh-tw" || settings.zhVariant === "zh-cn") return settings.zhVariant;
  for(const l of (navigator.languages || [navigator.language || ""])){
    const s = String(l).toLowerCase();
    if(/^zh-(tw|hk|mo)|^zh-hant/.test(s)) return "zh-tw";
    if(/^zh-(cn|sg|my)|^zh-hans|^zh$/.test(s)) return "zh-cn";
  }
  return "zh-tw";
}
function uiKey(lang = curLang()){
  if(lang === "zh") return zhVariant() === "zh-cn" ? "zh-hans" : "zh-hant";
  if(lang === "ceb") return "en";
  return lang;
}
function T(key, ...args){
  const v = (STR[uiKey()] || STR.en)[key] ?? STR.en[key] ?? STR.ja[key] ?? key;
  return typeof v === "function" ? v(...args) : v;
}
function applyUI(){
  const k = uiKey();
  document.documentElement.lang = k === "zh-hant" ? "zh-Hant" : k === "zh-hans" ? "zh-Hans" : k;
  document.title = T("appName");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
  document.querySelectorAll("[data-t-html]").forEach(el => el.innerHTML = T(el.dataset.tHtml));
  $("sInput").placeholder = T("searchPh");
  $("myName").placeholder = T("namePh");
  $("gearBtn").title = T("settings");
  $("savedBtn").title = T("savedList");
  updateSaveBtn();
  if(!state.playing){
    $("route").textContent = T("routeHint");
    resetClockLabel();
  }else{
    $("clockLbl").textContent = state.rules.timeLimit ? T("left") : T("time");
  }
  ["start","goal"].forEach(fillCard);
  renderChallengeBar();
}

/* ════════ Wikipedia API ════════ */
function wikiHost(lang = curLang()){ return WIKIS[lang].host; }
async function api(params, lang = curLang()){
  const extra = lang === "zh" ? {variant:zhVariant(), uselang:zhVariant()} : {};
  const p = new URLSearchParams({format:"json", formatversion:"2", origin:"*", ...extra, ...params});
  const res = await fetch(`https://${wikiHost(lang)}/w/api.php?` + p);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error.info || data.error.code);
  return data;
}

const norm = t => (t || "").replace(/_/g," ").trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stripTags = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent.trim(); };
const fmtTime = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");

/* 名前空間（Category:=14, File:=6, Special:=-1 …）を言語ごとに */
const NS_FALLBACK = [["category",14],["file",6],["image",6],["template",10],["help",12],["wikipedia",4],["portal",100],
  ["user",2],["special",-1],["media",-2],["talk",1],["mediawiki",8],["module",828]];
async function ensureNs(lang = curLang()){
  if(state.ns[lang]) return state.ns[lang];
  const m = new Map(NS_FALLBACK);
  try{
    const d = await api({action:"query", meta:"siteinfo", siprop:"namespaces|namespacealiases"}, lang);
    const add = (k,id) => { if(k) m.set(k.toLowerCase(), id); };
    for(const ns of Object.values(d.query.namespaces)){ if(ns.id !== 0){ add(ns.name, ns.id); add(ns.canonical, ns.id); } }
    for(const a of d.query.namespacealiases) if(a.id !== 0) add(a.alias, a.id);
    state.ns[lang] = m;
  }catch(e){ /* 失敗したら次に再挑戦。とりあえず英語名で判定 */ }
  return m;
}
function nsOf(t, lang = curLang()){
  const i = t.indexOf(":");
  if(i <= 0) return 0;
  const m = state.ns[lang] || new Map(NS_FALLBACK);
  const id = m.get(t.slice(0,i).trim().toLowerCase());
  return id === undefined ? 0 : id;
}

/* ════════ お題くじ ════════ */
async function inlinkCount(title){
  const d = await api({action:"query", list:"backlinks", bltitle:title, blnamespace:"0",
                       bllimit:"500", blfilterredir:"nonredirects"});
  return {n:d.query.backlinks.length, more:!!d.continue};
}
async function pickTitle(role, avoid){
  const lang = curLang();
  const conf = settings.difficulty === "any" ? {minLen:0, minIn:0}
             : (WIKIS[lang].diff[settings.difficulty] || WIKIS[lang].diff.normal);
  const {minLen, minIn} = conf;
  let best = null;
  for(let round = 0; round < 8; round++){
    const d = await api({action:"query", generator:"random", grnnamespace:"0", grnlimit:"20",
      grnfilterredir:"nonredirects", prop:"info|pageprops", ppprop:"disambiguation"});
    const pages = d.query.pages.filter(p => !(p.pageprops && "disambiguation" in p.pageprops) && norm(p.title) !== norm(avoid));
    if(!pages.length) continue;
    pages.sort((a,b)=>b.length-a.length);
    if(role === "start" || !minIn){
      if(pages[0].length >= minLen) return {title:pages.find(p=>p.length>=minLen && Math.random()<.5)?.title || pages[0].title};
      if(!best || pages[0].length > (best.length||0)) best = {title:pages[0].title, length:pages[0].length};
      continue;
    }
    for(const p of pages.slice(0,3)){
      const c = await inlinkCount(p.title);
      if(c.n >= minIn) return {title:p.title, inlinks:c.n, more:c.more};
      if(!best || c.n > (best.inlinks||0)) best = {title:p.title, inlinks:c.n, more:c.more};
    }
  }
  return best;
}
async function getSummary(title){
  const d = await api({action:"query", titles:title, redirects:"1", prop:"extracts|pageimages|info",
    exintro:"1", explaintext:"1", exchars:"600", piprop:"thumbnail", pithumbsize:"400", inprop:"url|varianttitles"});
  const p = d.query.pages[0];
  if(p.missing !== undefined || p.invalid !== undefined) throw new Error(T("notFound", title));
  return p;
}
/* 画面に出す題名（中文は繁體／简体に変換したもの） */
function shown(p){
  if(!p) return "";
  if(curLang() === "zh" && p.varianttitles) return p.varianttitles[zhVariant()] || p.title;
  return p.title;
}

async function draw(role, fixedTitle){
  const card = $(role);
  card.classList.add("loading");
  $("teeoff").disabled = true;
  hidePop();
  try{
    await ensureNs();
    const other = role === "start" ? state.goal : state.start;
    const pick = fixedTitle ? {title:fixedTitle} : await pickTitle(role, other && other.title);
    if(!pick) throw new Error(T("noFound"));
    const p = await getSummary(pick.title);
    if(role === "goal"){
      if(pick.inlinks === undefined){ const c = await inlinkCount(p.title); pick.inlinks = c.n; pick.more = c.more; }
      p.inlinks = pick.inlinks; p.inlinksMore = pick.more;
    }
    p.lang = curLang();
    state[role] = p;
    fillCard(role);
  }catch(e){
    state[role] = null;
    card.querySelector(".title").textContent = T("fail");
    card.querySelector(".extract").textContent = T("err") + e.message;
    card.querySelector(".extract").hidden = false;
    card.querySelector("img").hidden = true;
  }finally{
    card.classList.remove("loading");
    $("teeoff").disabled = !(state.start && state.goal) || state.playing;
    $("shareOdai").disabled = !(state.start && state.goal);
    updateSaveBtn();
  }
}

function fillCard(role){
  const p = state[role], card = $(role);
  if(!p) return;
  const view = role === "goal" ? eff().goalView : "full";
  const title = card.querySelector(".title"), img = card.querySelector("img"),
        ext = card.querySelector(".extract"), meta = card.querySelector(".meta"),
        full = card.querySelector(".readFull");
  title.textContent = shown(p);
  title.classList.toggle("plain", view === "title");
  ext.textContent = (p.extract || T("noSummary")).replace(/\s+/g," ");
  ext.hidden = view === "title";
  if(p.thumbnail && view !== "title"){ img.src = p.thumbnail.source; img.hidden = false; } else img.hidden = true;
  full.hidden = view !== "full";
  meta.textContent = role === "goal" && p.inlinks !== undefined ? T("inlinks", p.inlinks, p.inlinksMore) : "";
}

function setPlaying(on){
  state.playing = on;
  document.body.classList.toggle("playing", on);
  if(!on) document.body.classList.remove("collapsed");
}

function resetGame(){
  stopTimer();
  setPlaying(false);
  state.strokes = 0; state.stack = []; state.route = []; state.result = null; state.rules = null;
  $("strokeNum").textContent = "0";
  $("clockNum").classList.remove("warn");
  resetClockLabel();
  $("route").textContent = T("routeHint");
  $("teeoff").hidden = false; $("backBtn").hidden = true;
  $("findbar").hidden = true; $("findbar").classList.remove("open"); $("findToggle").hidden = true;
  document.querySelectorAll(".card .reroll").forEach(b => { b.disabled = false; b.hidden = !!state.challenge; });
  $("frame").onload = null;
  $("frame").removeAttribute("srcdoc");
  $("placeholder").hidden = false;
}
function resetClockLabel(){
  const lim = eff().timeLimit;
  $("clockNum").textContent = lim ? fmtTime(lim) : "0:00";
  $("clockLbl").textContent = lim ? T("left") : T("time");
}

async function newOdai(){
  exitChallenge();
  state.start = state.goal = null;
  resetGame();
  applyUI();
  state.start = state.goal = null;
  await Promise.all([draw("start"), draw("goal")]);
}
async function loadChallenge(){
  state.start = state.goal = null;
  resetGame();
  applyUI();
  state.start = state.goal = null;
  $("shareOdai").disabled = true;
  await Promise.all([draw("start", state.challenge.start), draw("goal", state.challenge.goal)]);
}
/* 字体を変えたとき：同じお題のまま出し直す */
async function redrawSame(){
  const s = state.start && state.start.title, g = state.goal && state.goal.title;
  applyUI();
  if(s && g) await Promise.all([draw("start", s), draw("goal", g)]);
}

/* ════════ 記事を取ってくる ════════ */
async function loadArticle(title){
  if(nsOf(title) < 0) throw new Error(T("rSpecial"));
  const d = await api({action:"parse", page:title, redirects:"1", prop:"text|displaytitle|categorieshtml",
                       disableeditsection:"1", useskin:"vector-2022"});
  const p = d.parse;
  p.ns = nsOf(p.title);
  p.shownTitle = stripTags(p.displaytitle) || p.title;
  if(p.ns === 14) p.text += await categoryMembersHtml(p.title);
  if(p.ns === 6)  p.text = await fileImageHtml(p.title) + p.text;
  return p;
}

async function categoryMembersHtml(cat){
  const d = await api({action:"query", list:"categorymembers", cmtitle:cat, cmlimit:"500", cmprop:"title|sortkeyprefix|type"});
  const all = d.query.categorymembers, more = !!d.continue;
  const catName = cat.slice(cat.indexOf(":")+1);
  const strip = t => t.slice(t.indexOf(":")+1);
  const block = items => {
    const groups = [];
    for(const m of items){
      const sh = m.type === "subcat" ? strip(m.title) : m.title;
      const key = ((m.sortkeyprefix || "").trim() || sh).charAt(0).toUpperCase() || "*";
      if(!groups.length || groups[groups.length-1].key !== key) groups.push({key, items:[]});
      groups[groups.length-1].items.push(`<li><a href="/wiki/${encodeURIComponent(m.title.replace(/ /g,"_"))}" title="${esc(m.title)}">${esc(sh)}</a></li>`);
    }
    return `<div dir="ltr" class="mw-content-ltr"><div class="mw-category${items.length > 6 ? " mw-category-columns" : ""}">` +
      groups.map(g=>`<div class="mw-category-group"><h3>${esc(g.key)}</h3>\n<ul>${g.items.join("")}</ul></div>`).join("") + `</div></div>`;
  };
  const subs = all.filter(m=>m.type==="subcat"), pages = all.filter(m=>m.type==="page"), files = all.filter(m=>m.type==="file");
  const mn = more ? T("more500") : "";
  let h = "";
  if(subs.length) h += `<div id="mw-subcategories"><h2>${esc(T("catSub"))}</h2><p>${esc(T("catSubN", subs.length))}${mn}</p>${block(subs)}</div>`;
  if(pages.length) h += `<div id="mw-pages"><h2>${esc(T("catPages", catName))}</h2><p>${esc(T("catPagesN", pages.length))}${mn}</p>${block(pages)}</div>`;
  if(files.length) h += `<div id="mw-category-media"><h2>${esc(T("catMedia", catName))}</h2><p>${esc(T("catMediaN", files.length))}</p>${block(files)}</div>`;
  return h || `<p>${esc(T("catEmpty"))}</p>`;
}
async function fileImageHtml(title){
  try{
    const d = await api({action:"query", titles:title, prop:"imageinfo", iiprop:"url|size", iiurlwidth:"800"});
    const ii = d.query.pages[0].imageinfo && d.query.pages[0].imageinfo[0];
    if(!ii) return "";
    return `<div class="fullImageLink" id="file"><a href="${esc(ii.url)}" class="external"><img src="${esc(ii.thumburl || ii.url)}" style="max-width:100%;height:auto" alt="${esc(title)}"></a>` +
      `<div class="mw-filepage-resolutioninfo">(${ii.width} × ${ii.height} px)</div></div>`;
  }catch(e){ return ""; }
}

const BLOCK_CURSOR = `url("data:image/svg+xml,${encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><circle cx='12' cy='12' r='9' fill='white' stroke='#e0352b' stroke-width='3'/><line x1='5.6' y1='5.6' x2='18.4' y2='18.4' stroke='#e0352b' stroke-width='3'/></svg>")}") 12 12, not-allowed`;

/* /wiki/題名 、中文の /zh-tw/題名 などから題名を取り出す */
function linkTitle(href){
  const m = href.match(/^\/(?:wiki|zh(?:-[a-z]+)?)\/([^?#]+)/i);
  if(!m) return null;
  let t = m[1];
  try{ t = decodeURIComponent(t); }catch(e){}
  return norm(t);
}

function fillFrame(frame, parsed, onClick, extraCss){
  return new Promise(resolve=>{
    frame.onload = ()=>{
      const doc = frame.contentDocument;
      if(!doc || !doc.body) return;
      doc.addEventListener("click", onClick);
      resolve(doc);
    };
    frame.srcdoc = buildDoc(parsed, extraCss);
  });
}
function scrollToAnchor(doc, href){
  let id = href.slice(1);
  try{ id = decodeURIComponent(id); }catch(_){}
  const el = doc.getElementById(id);
  if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
}
function linkAllowed(a, t, rules){
  if(a.classList.contains("new")) return T("rRed");
  if(!t) return T("rExt");
  const ns = nsOf(t);
  if(ns < 0) return T("rSpecial");
  if(ns === 14 && rules && !rules.allowCategory) return T("rCat");
  return "";
}

const narrow = matchMedia("(max-width:720px)");
async function render(parsed){
  const doc = await fillFrame($("frame"), parsed, onFrameClick);
  doc.querySelectorAll("a[href]").forEach(a=>{
    const href = a.getAttribute("href");
    if(href.startsWith("#")) return;
    if(linkAllowed(a, linkTitle(href), state.rules)) a.classList.add("golf-blocked");
  });
  // スマホ：下にスクロールしたらお題の帯を引っこめる
  let lastY = 0;
  const fw = $("frame").contentWindow;
  if(fw) fw.addEventListener("scroll", ()=>{
    if(!narrow.matches || !state.playing) return;
    const y = $("frame").contentWindow.scrollY;
    if(y > lastY + 12 && y > 80) document.body.classList.add("collapsed");
    else if(y < lastY - 12 || y < 40) document.body.classList.remove("collapsed");
    lastY = y;
  }, {passive:true});
  document.body.classList.remove("collapsed");
  $("placeholder").hidden = true;
  hits = []; cur = -1;
  if($("sInput").value.trim()) doSearch(false); else $("sCount").textContent = "";
}

function onFrameClick(e){
  const a = e.target.closest("a[href]");
  if(!a) return;
  e.preventDefault();
  const href = a.getAttribute("href");
  if(href.startsWith("#")) return scrollToAnchor(e.target.ownerDocument, href);
  if(!state.playing){
    window.open(href.startsWith("/") ? `https://${wikiHost()}` + href : a.href, "_blank", "noopener");
    return;
  }
  const t = linkTitle(href);
  const why = linkAllowed(a, t, state.rules);
  if(why) return toast(why);
  go(t);
}

async function go(title, {count = true, back = false} = {}){
  if(state.busy) return;
  state.busy = true;
  $("frame").classList.add("busy");
  try{
    const parsed = await loadArticle(title);
    if(!state.playing) return;               // 読み込み中に時間切れ
    await render(parsed);
    if(count){ state.strokes++; $("strokeNum").textContent = state.strokes; }
    if(!back) state.stack.push(parsed.title);
    state.route.push({title:parsed.title, shown:parsed.shownTitle, back});
    drawRoute();
    $("backBtn").disabled = state.stack.length < 2;
    if(state.route.length > 1 && norm(parsed.title) === norm(state.goal.title)) finish(true);
  }catch(e){
    toast(T("loadFail") + e.message);
  }finally{
    state.busy = false;
    $("frame").classList.remove("busy");
  }
}

function drawRoute(){
  const r = $("route");
  r.innerHTML = "";
  state.route.forEach((s,i)=>{
    if(i){ const sep = document.createElement("span"); sep.className = "sep"; sep.textContent = s.back ? "↩" : "→"; r.appendChild(sep); }
    const sp = document.createElement("span");
    sp.className = "step" + (s.back ? " back" : "");
    sp.textContent = s.shown;
    r.appendChild(sp);
  });
  r.scrollLeft = r.scrollWidth;
}

function startTimer(){ state.t0 = Date.now(); state.elapsed = 0; state.timer = setInterval(tick, 250); tick(); }
function stopTimer(){
  if(state.timer){ clearInterval(state.timer); state.timer = null; }
  if(state.t0) state.elapsed = (Date.now() - state.t0) / 1000;
}
function tick(){
  const sec = (Date.now() - state.t0) / 1000;
  const lim = state.rules && state.rules.timeLimit;
  if(lim){
    const left = Math.max(0, lim - sec);
    $("clockNum").textContent = fmtTime(Math.ceil(left));
    $("clockNum").classList.toggle("warn", left <= 30);
    if(left <= 0 && state.playing) finish(false);
  }else $("clockNum").textContent = fmtTime(sec);
}

let hits = [], cur = -1, searchTimer;
function doSearch(jump){
  const doc = $("frame").contentDocument;
  if(!doc || !doc.body) return;
  doc.querySelectorAll("mark.golf-hit").forEach(m => m.replaceWith(m.textContent));
  doc.body.normalize();
  hits = []; cur = -1;
  const q = $("sInput").value.trim().toLowerCase();
  if(!q){ $("sCount").textContent = ""; return; }
  const root = doc.getElementById("bodyContent") || doc.body;
  const linkOnly = $("linkOnly").checked;
  const tw = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    const p = n.parentElement;
    if(!p || p.closest("style,script")) return NodeFilter.FILTER_REJECT;
    if(linkOnly && !p.closest("a[href]")) return NodeFilter.FILTER_REJECT;
    return n.nodeValue.toLowerCase().includes(q) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  }});
  const nodes = [];
  while(tw.nextNode()) nodes.push(tw.currentNode);
  for(const node of nodes){
    let idx = node.nodeValue.toLowerCase().lastIndexOf(q);
    while(idx >= 0){
      const hit = node.splitText(idx);
      hit.splitText(q.length);
      const m = doc.createElement("mark");
      m.className = "golf-hit";
      hit.replaceWith(m); m.appendChild(hit);
      idx = idx > 0 ? node.nodeValue.toLowerCase().lastIndexOf(q) : -1;
    }
  }
  hits = [...root.querySelectorAll("mark.golf-hit")];
  $("sCount").textContent = T("hits", hits.length);
  if(jump && hits.length) step(1);
}
function step(d){
  if(!hits.length) return doSearch(true);
  if(cur >= 0) hits[cur].classList.remove("golf-cur");
  cur = (cur + d + hits.length) % hits.length;
  hits[cur].classList.add("golf-cur");
  hits[cur].scrollIntoView({block:"center"});
  $("sCount").textContent = `${cur+1} / ${hits.length}`;
}
$("sInput").addEventListener("input", ()=>{ clearTimeout(searchTimer); searchTimer = setTimeout(()=>doSearch(false), 200); });

$("sNext").addEventListener("click", ()=>step(1));
$("sPrev").addEventListener("click", ()=>step(-1));

function schema(){

  ];

    opts:[["auto",T("auto")],["zh-tw","繁體"],["zh-cn","简体"]]});
  rows.push(
    {head:T("hRules")},
    {key:"difficulty", label:T("diff"), note:T("diffNote2"), rule:true, opts:[["easy",T("easy"),T("easyD")],["normal",T("normal"),T("normalD")],["any",T("any"),T("anyD")]]},
    {key:"allowCategory", label:T("cat"), rule:true, opts:[[true,T("yes")],[false,T("no")]]},
    {key:"allowBack", label:T("backRule"), rule:true, opts:[[true,T("yes")],[false,T("no")]]},
    {key:"allowSearch", label:T("searchRule"), note:T("searchNote"), rule:true, opts:[[true,T("yes")],[false,T("no")]]},
    {key:"timeLimit", label:T("limit"), rule:true, opts:[[0,T("none")],[180,T("min",3)],[300,T("min",5)],[600,T("min",10)]]},
    {head:T("hView")},
    {key:"goalView", label:T("view"), note:T("viewNote"), rule:true, opts:[["full",T("full")],["summary",T("summary")],["title",T("titleOnly")]]},
    {head:T("hImg")},
    {key:"shape", label:T("shape"), opts:[["wide",T("wide")],["square",T("square")]]},
    {key:"routeImg", label:T("routeImg"), note:T("routeNote"), opts:[["hide",T("routeHide")],["show",T("routeShow")]]}
  );
  return rows;
}
function buildSettings(){
  const box = $("settingRows");
  box.innerHTML = "";
  for(const row of schema()){
    if(row.head){ const h = document.createElement("div"); h.className = "shead"; h.textContent = row.head; box.appendChild(h); continue; }
    const locked = (row.rule && (state.playing || state.challenge)) || (row.play && state.playing) || (row.chOnly && state.challenge);
    const div = document.createElement("div");
    div.className = "srow" + (locked ? " locked" : "");
    div.innerHTML = `<div class="slabel">${esc(row.label)}</div>` + (row.note ? `<div class="snote">${esc(row.note)}</div>` : "");
    const seg = document.createElement("div"); seg.className = "seg";
    for(const [val, lab, desc] of row.opts){
      const b = document.createElement("button");
      b.textContent = lab;
      if(desc){ b.classList.add("withDesc"); const sm = document.createElement("small"); sm.textContent = desc; b.appendChild(sm); }
      if((row.rule || row.chOnly ? eff() : settings)[row.key] === val) b.classList.add("on");
      b.addEventListener("click", ()=> changeSetting(row.key, val));
      seg.appendChild(b);
    }
    div.appendChild(seg);
    box.appendChild(div);
  }
  $("lockNote").hidden = !(state.playing || state.challenge);
  $("lockNote").textContent = state.challenge ? T("lockCh") : T("lockPlay");
  $("quitHole").hidden = !(state.playing || state.challenge);
  $("quitHole").textContent = state.challenge ? T("quitCh") : T("quitHole");
}
function changeSetting(key, val){
  const old = settings[key];
  if(key === "lang" && old !== val && state.playing && state.strokes > 0 && !confirm(T("confirmNew"))) return;
  settings[key] = val; saveSettings();
  if(key === "lang" && old !== val){ newOdai(); buildSettings(); return; }
  if(key === "zhVariant" && old !== val){ redrawSame().then(buildSettings); buildSettings(); return; }
  buildSettings();
  if(key === "goalView"){ fillCard("goal"); hidePop(); }
  if(key === "timeLimit" && !state.playing) resetClockLabel();
  if(key === "difficulty" && old !== val) toast(T("nextOdai"));
}
$("quitHole").addEventListener("click", ()=>{

  $("settings").classList.remove("show");

});

function rulesText(r){
  const parts = [T("rDiff") + T(r.difficulty)];
  parts.push(r.timeLimit ? T("rLimit", r.timeLimit/60) : T("rNoLimit"));
  parts.push(T("rView") + T({full:"vFull", summary:"vSum", title:"vTitle"}[r.goalView]));
  if(!r.allowCategory) parts.push(T("rNoCat"));
  if(!r.allowBack) parts.push(T("rNoBack"));
  if(!r.allowSearch) parts.push(T("rNoSearch"));
  if(r.lang !== settings.lang || state.challenge) parts.unshift(T("rLang") + WIKIS[r.lang].name);
  return parts.join(T("sep"));
}

/* ════════ 挑戦状・お題共有 ════════ */
const D_CODE = {easy:"e", normal:"n", any:"a"}, V_CODE = {full:"f", summary:"s", title:"t"};
const inv = o => Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k]));
function encodeRules(r){
  return [D_CODE[r.difficulty] || "n", r.allowCategory ? 1 : 0, r.allowBack ? 1 : 0, r.allowSearch ? 1 : 0,
          r.timeLimit || 0, V_CODE[r.goalView] || "f"].join(".");
}
function decodeRules(str, lang){
  const a = String(str || "").split(".");
  const t = parseInt(a[4], 10);
  return {
    lang: WIKIS[lang] ? lang : "ja",
    difficulty: inv(D_CODE)[a[0]] || "normal",
    allowCategory: a[1] !== "0", allowBack: a[2] !== "0", allowSearch: a[3] !== "0",
    timeLimit: [0,180,300,600].includes(t) ? t : 0,
    goalView: inv(V_CODE)[a[5]] || "full"
  };
}
let myName = "";
try{ myName = localStorage.getItem("wikiGolfName") || ""; }catch(e){}
function saveName(n){ myName = n.trim().slice(0,20); try{ localStorage.setItem("wikiGolfName", myName); }catch(e){} }

const isFile = () => location.protocol === "file:";
function baseUrl(){ return isFile() ? location.href.split(/[?#]/)[0] : location.origin + location.pathname; }
function challengeUrl({start, goal, rules, name, strokes, time}){
  const q = new URLSearchParams({l:rules.lang, s:start, g:goal, r:encodeRules(rules)});
  if(strokes != null){ q.set("k", strokes); if(time != null) q.set("t", time); if(name) q.set("n", name); }
  return baseUrl() + "?" + q.toString();
}
function parseChallenge(){
  const q = new URLSearchParams(location.search);
  const s = q.get("s"), g = q.get("g");
  if(!s || !g) return null;
  const k = parseInt(q.get("k"), 10), t = parseInt(q.get("t"), 10);
  // ?l= が無い古いリンク（v0.6）は日本語版
  return {start:s, goal:g, rules:decodeRules(q.get("r"), q.get("l") || "ja"),
          name:(q.get("n") || "").trim().slice(0,20),
          strokes: Number.isFinite(k) ? k : null, time: Number.isFinite(t) ? t : null};
}
function chName(ch){ return ch.name || T("someone"); }
function renderChallengeBar(){
  const ch = state.challenge, bar = $("chBar");
  bar.hidden = !ch;
  $("newBtn").textContent = ch ? "🏠 " + T("exitCh") : T("newOdai");
  if(!ch) return;
  const t = $("chText"); t.innerHTML = "";
  const b = document.createElement("b");
  b.textContent = ch.strokes != null ? T("chText", chName(ch), T("sk", ch.strokes), ch.time != null ? fmtTime(ch.time) : "") : ch.saved ? T("savedPlay") : T("shared");
  const r = document.createElement("span"); r.className = "chRules"; r.textContent = "　" + T("rulesPre") + rulesText(ch.rules);
  t.append(b, r);
}
function exitChallenge(){
  if(!state.challenge) return;
  state.challenge = null;
  renderChallengeBar();
  try{ history.replaceState(null, "", baseUrl()); }catch(e){}
}
function judge(r, ch){
  if(!ch || ch.strokes == null) return null;
  let res;
  const my = Math.round(r.elapsed);
  if(!r.success) res = "lose";
  else if(r.strokes !== ch.strokes) res = r.strokes < ch.strokes ? "win" : "lose";
  else if(ch.time != null && my !== ch.time) res = my < ch.time ? "win" : "lose";
  else res = "draw";
  return {name:chName(ch), strokes:ch.strokes, time:ch.time, res};
}

  newOdai();
});

/* ── QRコード ── */
function makeQr(text){
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  return qr;
}
function drawQr(ctx, qr, x, y, size){
  const n = qr.getModuleCount(), quiet = 2, cell = size / (n + quiet*2);
  ctx.fillStyle = "#fff"; ctx.fillRect(x, y, size, size);
  ctx.fillStyle = "#000";
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++){
    if(qr.isDark(r, c)) ctx.fillRect(x + (c+quiet)*cell, y + (r+quiet)*cell, Math.ceil(cell), Math.ceil(cell));
  }
}
let qrLink = null;
function openQr(kind, url, text, sub){
  qrLink = {url, text};
  $("qrTitle").textContent = kind === "ch" ? T("qrCh") : T("qrOdai");
  $("qrSub").textContent = sub;
  $("qrUrl").textContent = url;
  $("qrWarn").hidden = !isFile();
  const box = $("qrBox"); box.innerHTML = "";
  try{
    const qr = makeQr(url);
    const n = qr.getModuleCount(), px = 6, size = (n + 4) * px;
    const cv = document.createElement("canvas"); cv.width = cv.height = size;
    drawQr(cv.getContext("2d"), qr, 0, 0, size);
    box.appendChild(cv);
  }catch(e){ box.textContent = T("qrFail"); }
  $("qrSend").hidden = !navigator.share;
  $("qrModal").classList.add("show");
}

/* ════════ シェア画像 ════════ */
function fontStack(){
  const k = uiKey();
  const ja = `"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo`;
  const ko = `"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR"`;
  const tc = `"PingFang TC","Microsoft JhengHei","Noto Sans TC"`;
  const sc = `"PingFang SC","Microsoft YaHei","Noto Sans SC"`;
  const order = k === "ko" ? [ko, ja, tc, sc] : k === "zh-hant" ? [tc, sc, ja, ko] : k === "zh-hans" ? [sc, tc, ja, ko] : [ja, ko, tc, sc];
  return `"Helvetica Neue",Arial,${order.join(",")},sans-serif`;
}
const FONT = (w, s) => `${w} ${s}px ${fontStack()}`;
const C = {bg:"#eef5ec", card:"#ffffff", ink:"#1f2a1f", sub:"#5b6b5b", green:"#2f7d3a", green2:"#e3f1e1",
           flag:"#d6453d", flag2:"#fbe7e5", line:"#d5e2d2"};
function rr(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
/* 文字ごとに折り返し（英語などは単語の途中で折らない） */
function wrapText(ctx, text, maxW){
  const units = text.match(/[A-Za-zÀ-ÿ0-9'’\-]+\s*|\s+|./gu) || [];
  const lines = []; let line = "";
  for(const u of units){
    if(ctx.measureText(line + u).width > maxW && line.trim()){
      lines.push(line.trimEnd()); line = u.trimStart();
      while(ctx.measureText(line).width > maxW && line.length > 1){
        let i = line.length - 1;
        while(i > 1 && ctx.measureText(line.slice(0,i)).width > maxW) i--;
        lines.push(line.slice(0,i)); line = line.slice(i);
      }
    }else line += u;
  }
  if(line.trim()) lines.push(line.trimEnd());
  return lines;
}
function wrapTokens(ctx, tokens, maxW){
  const lines = [[]]; let x = 0;
  let mask = false;
  const push = (t, c) => { lines[lines.length-1].push({t, c, mask}); x += ctx.measureText(t).width; };
  const nl = () => { lines.push([]); x = 0; };
  for(const tok of tokens){
    mask = !!tok.mask;
    const w = ctx.measureText(tok.t).width;
    if(x + w <= maxW){ push(tok.t, tok.c); continue; }
    if(tok.sep){ nl(); push(tok.t.trimStart(), tok.c); continue; }
    if(w <= maxW){ nl(); push(tok.t, tok.c); continue; }
    let buf = "";
    for(const ch of tok.t){
      if(x + ctx.measureText(buf + ch).width > maxW && (buf || x)){ if(buf) push(buf, tok.c); buf = ""; nl(); }
      buf += ch;
    }
    if(buf) push(buf, tok.c);
  }
  return lines.filter(l => l.length);
}
function routeTokens(steps, maskMid, showLast){
  const toks = [];
  steps.forEach((s,i)=>{
    if(i) toks.push({t: s.back ? " ↩ " : " → ", c:C.sub, sep:true});
    const isEnd = i === 0 || (showLast && i === steps.length - 1);
    const mask = maskMid && !isEnd && !s.gap;
    toks.push({t:s.title, c: mask ? C.ink : (s.gap || s.back) ? C.sub : C.ink, mask});
  });
  return toks;
}
function shareQrUrl(){
  const r = state.result;
  if(isFile()) return null;
  return challengeUrl({start:r.startId, goal:r.goalId, rules:r.rules, name:myName,
    strokes:r.success ? r.strokes : null, time:r.success ? Math.round(r.elapsed) : null});
}

function drawShare(measureOnly, W, H, routeFont, steps, oy = 0, qr = null){
  const r = state.result;
  const cv = document.createElement("canvas");
  const S = 2;
  cv.width = W * S; cv.height = (H || 10) * S;
  const ctx = cv.getContext("2d");
  ctx.scale(S, S);
  ctx.textBaseline = "alphabetic";
  const M = 28, PX = 64, cw = W - PX*2;
  let y = M + 36 + oy;
  const D = !measureOnly;

  if(D){
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.card; rr(ctx, M, M, W - M*2, H - M*2, 26); ctx.fill();
    ctx.save(); rr(ctx, M, M, W - M*2, H - M*2, 26); ctx.clip();
    ctx.fillStyle = C.green; ctx.fillRect(M, M, W - M*2, 10); ctx.restore();
  }
  // ヘッダー
  y += 16;
  ctx.font = FONT(800, 26);
  if(D){ ctx.fillStyle = C.ink; ctx.fillText("⛳ " + T("appName") + (r.rules.lang !== "ja" || uiKey() !== "ja" ? `  ·  ${WIKIS[r.rules.lang].name}` : ""), PX, y); }
  const d = r.date;
  const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  ctx.font = FONT(500, 20);
  if(D){ ctx.fillStyle = C.sub; ctx.textAlign = "right"; ctx.fillText(dateStr, W - PX, y); ctx.textAlign = "left"; }
  y += 30;

  // スタート・ゴール
  ctx.font = FONT(800, 21);
  const pillW = Math.max(150, ctx.measureText(T("start")).width + 40, ctx.measureText(T("goal")).width + 40);
  const tx = PX + pillW + 20, tw = cw - pillW - 20;
  for(const [label, title, fg, bgc] of [[T("start"), r.start, C.green, C.green2], [T("goal"), r.goal, C.flag, C.flag2]]){
    let fs = 46, lines;
    do{ ctx.font = FONT(800, fs); lines = wrapText(ctx, title, tw); if(lines.length <= 2) break; fs -= 2; }while(fs > 28);
    if(lines.length > 2){ lines = lines.slice(0,2); lines[1] = lines[1].slice(0, -1) + "…"; }
    const lh = fs * 1.28, rowH = Math.max(52, lines.length * lh);
    if(D){
      const pillY = y + (Math.min(rowH, lh) - 44)/2 + 4;
      ctx.fillStyle = bgc; rr(ctx, PX, pillY, pillW, 44, 22); ctx.fill();
      ctx.font = FONT(800, 21); ctx.fillStyle = fg; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(label, PX + pillW/2, pillY + 23); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      ctx.font = FONT(800, fs); ctx.fillStyle = C.ink;
      lines.forEach((ln, i) => ctx.fillText(ln, tx, y + lh*(i+1) - fs*0.22));
    }
    y += rowH + 14;
  }

  // 打数
  y += 6;
  const sc = String(r.strokes);
  ctx.font = FONT(900, 104);
  const nw = ctx.measureText(sc).width;
  const unit = r.success ? (r.strokes === 1 ? T("imgHio") : T("imgOk", r.strokes)) : T("imgNg");
  ctx.font = FONT(600, 24);
  const timeStr = T("timeLbl") + fmtTime(r.elapsed);
  const timeW = ctx.measureText(timeStr).width;
  let ufs = 38;
  ctx.font = FONT(800, ufs);
  while(ufs > 22 && PX + nw + 12 + ctx.measureText(unit).width > W - PX - timeW - 20){ ufs -= 2; ctx.font = FONT(800, ufs); }
  if(D){
    ctx.font = FONT(900, 104); ctx.fillStyle = r.success ? C.green : C.flag; ctx.fillText(sc, PX, y + 92);
    ctx.font = FONT(800, ufs); ctx.fillStyle = C.ink; ctx.fillText(unit, PX + nw + 12, y + 90);
    ctx.font = FONT(600, 24); ctx.fillStyle = C.sub; ctx.textAlign = "right";
    ctx.fillText(timeStr, W - PX, y + 90); ctx.textAlign = "left";
  }
  y += 116;

  // 挑戦状の結果
  if(r.vs){
    const vsText = T("imgVs", r.vs.name, T("sk", r.vs.strokes), r.vs.time != null ? fmtTime(r.vs.time) : "");
    ctx.font = FONT(700, 28);
    if(D){
      ctx.fillStyle = C.sub; ctx.fillText(vsText, PX, y + 26);
      const w = ctx.measureText(vsText).width;
      ctx.font = FONT(900, 32);
      ctx.fillStyle = r.vs.res === "win" ? C.green : r.vs.res === "lose" ? C.flag : C.ink;
      ctx.fillText(T(r.vs.res), PX + w, y + 26);
    }
    y += 56;
  }

  if(D){ ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(PX, y); ctx.lineTo(W-PX, y); ctx.stroke(); }
  y += 34;
  ctx.font = FONT(700, 18);
  if(D){ ctx.fillStyle = C.sub; ctx.fillText(T("route"), PX, y); }
  y += 14;

  ctx.font = FONT(600, routeFont);
  const rl = wrapTokens(ctx, routeTokens(steps, settings.routeImg !== "show", r.success), cw);
  const rlh = routeFont * 1.6;
  rl.forEach(line=>{
    y += rlh;
    if(D){ let x = PX; for(const seg of line){
      const w = ctx.measureText(seg.t).width;
      ctx.fillStyle = seg.c;
      if(seg.mask){ rr(ctx, x + 1, y - routeFont*1.12, Math.max(4, w - 2), routeFont*1.02, 3); ctx.fill(); }
      else ctx.fillText(seg.t, x, y - routeFont*0.3);
      x += w;
    } }
  });

  // 下の段：ルール（左）とQR（右）
  y += 24;
  const Q = qr ? 132 : 0;
  ctx.font = FONT(500, 18);
  const rlines = wrapText(ctx, rulesText(r.rules), cw - (Q ? Q + 28 : 0));
  const footTop = y;
  rlines.forEach((ln, i) => { if(D){ ctx.fillStyle = C.sub; ctx.fillText(ln, PX, footTop + 22 + i*28); } });
  let footH = rlines.length * 28 + 6;
  if(qr){
    if(D){
      drawQr(ctx, qr, W - PX - Q, footTop - 6, Q);
      ctx.font = FONT(600, 15); ctx.fillStyle = C.sub; ctx.textAlign = "center";
      ctx.fillText(T("qrCaption"), W - PX - Q/2, footTop - 6 + Q + 20); ctx.textAlign = "left";
    }
    footH = Math.max(footH, Q + 22);
  }
  y = footTop + footH + M + 34;
  return {height:y, canvas:cv};
}

function makeShareCanvas(){
  const r = state.result;
  const wide = settings.shape === "wide";
  const W = wide ? 1200 : 1080, baseH = wide ? 630 : 1080, maxH = wide ? 1600 : 1080;
  let qr = null;
  const qurl = shareQrUrl();
  if(qurl){ try{ qr = makeQr(qurl); }catch(e){ qr = null; } }
  let steps = r.route, font = 0;
  for(const fs of [28, 26, 24, 22, 20, 18]){
    if(drawShare(true, W, 0, fs, steps, 0, qr).height <= maxH){ font = fs; break; }
  }
  if(!font){
    font = 18;
    for(let k = Math.floor(r.route.length/2) - 1; k >= 2; k--){
      const s = [...r.route.slice(0,k), {title:T("omitted", r.route.length - k*2), gap:true}, ...r.route.slice(-k)];
      steps = s;
      if(drawShare(true, W, 0, font, s, 0, qr).height <= maxH) break;
    }
  }
  const contentH = drawShare(true, W, 0, font, steps, 0, qr).height;
  const h = Math.max(baseH, Math.min(maxH, contentH));
  const oy = contentH < h ? (h - contentH) / 2 : 0;
  return drawShare(false, W, h, font, steps, oy, qr).canvas;
}
function shareBlob(){
  return new Promise((res, rej) => makeShareCanvas().toBlob(b => b ? res(b) : rej(new Error(T("imgFail"))), "image/png"));
}
function shareFileName(){
  const d = state.result.date, p = n => String(n).padStart(2,"0");
  return `wiki-golf-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
}
function shareText(){
  const r = state.result;
  let t = T("txtRes", r.start, r.goal, r.success, T("sk", r.strokes), fmtTime(r.elapsed));
  if(r.vs) t += "\n" + T("txtVs", r.vs.name, T("sk", r.vs.strokes), T(r.vs.res));
  t += "\n" + T("tag");
  const u = shareQrUrl();
  if(u) t += "\n" + u;
  return t;
}
async function saveImage(){
  try{
    const blob = await shareBlob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = shareFileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){ toast(e.message); }
}
$("saveImg").addEventListener("click", ()=>{ saveName($("myName").value); saveImage(); });
$("shareImg").addEventListener("click", async ()=>{
  saveName($("myName").value);
  try{
    const blob = await shareBlob();
    const file = new File([blob], shareFileName(), {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text:shareText()});
      return;
    }
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
      toast(T("imgCopied"));
      return;
    }
    toast(T("cantShare"));
    saveImage();
  }catch(e){
    if(e.name !== "AbortError") toast(T("shareFail") + e.message);
  }
});

/* ════════ 保存したお題（このブラウザの中だけ） ════════ */
const SAVE_KEY = "wikiGolfSaved";
function loadSaved(){
  try{ const a = JSON.parse(localStorage.getItem(SAVE_KEY) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
}
function storeSaved(a){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(a)); return true; }catch(e){ toast(T("saveFail")); return false; }
}
const odaiKey = (lang, s, g) => `${lang}|${norm(s)}|${norm(g)}`;
const pickRules = r => Object.fromEntries(RULE_KEYS.map(k => [k, r[k]]));
function upsertOdai(lang, startId, goalId, start, goal, rules){
  const a = loadSaved(), key = odaiKey(lang, startId, goalId);
  let e = a.find(x => x.key === key);
  if(!e){ e = {key, lang, startId, goalId, start, goal, rules:pickRules(rules), savedAt:Date.now(), plays:[]}; a.unshift(e); }
  return {a, e};
}
function currentOdaiKey(){
  if(!state.start || !state.goal) return null;
  return odaiKey(curLang(), state.start.title, state.goal.title);
}
function updateSaveBtn(){
  const b = $("saveOdai"), key = currentOdaiKey();
  const done = !!key && loadSaved().some(x => x.key === key);
  b.disabled = !key || done;
  b.textContent = done ? T("savedOk") : T("saveOdai");
}
$("saveOdai").addEventListener("click", ()=>{
  if(!state.start || !state.goal) return;
  const rules = state.playing ? state.rules : {...eff()};
  const {a} = upsertOdai(rules.lang, state.start.title, state.goal.title, shown(state.start), shown(state.goal), rules);
  if(storeSaved(a)){ toast(T("savedToast")); updateSaveBtn(); }
});
$("saveRecord").addEventListener("click", ()=>{
  const r = state.result;
  if(!r) return;
  const {a, e} = upsertOdai(r.rules.lang, r.startId, r.goalId, r.start, r.goal, r.rules);
  e.plays.unshift({route:r.route, strokes:r.strokes, time:Math.round(r.elapsed), success:r.success,
                   date:r.date.getTime(), rules:pickRules(r.rules)});
  if(storeSaved(a)){
    $("saveRecord").disabled = true; $("saveRecord").textContent = T("recordSaved");
    updateSaveBtn();
  }
});

function renderSaved(){
  const a = loadSaved(), box = $("savedRows");
  box.innerHTML = "";
  $("savedEmpty").hidden = a.length > 0;
  $("clearAll").hidden = !a.length;
  const fmtDate = ms => { try{ return new Date(ms).toLocaleString(T("locale"), {dateStyle:"short", timeStyle:"short"}); }catch(_){ return new Date(ms).toLocaleString(); } };
  const el = (tag, cls, text) => { const x = document.createElement(tag); if(cls) x.className = cls; if(text != null) x.textContent = text; return x; };
  for(const e of a){
    const row = el("div", "sv"), top = el("div", "svTop"), head = el("div", "svHead");
    head.append(el("div", "svTitle", `${e.start}  →  ${e.goal}`));
    const wins = e.plays.filter(p => p.success);
    const best = wins.length ? T("best", T("sk", Math.min(...wins.map(p => p.strokes)))) : T("notCleared");
    head.append(el("div", "svMeta", [WIKIS[e.lang] ? WIKIS[e.lang].name : e.lang, best, T("plays", e.plays.length)].join(" · ")));
    const btns = el("div", "svBtns");
    const play = el("button", "", T("playThis")), del = el("button", "", T("delBtn"));
    play.addEventListener("click", ()=> playSaved(e));
    del.addEventListener("click", ()=>{
      if(!confirm(T("confirmDel"))) return;
      storeSaved(loadSaved().filter(x => x.key !== e.key));
      renderSaved(); updateSaveBtn();
    });
    btns.append(play, del);
    top.append(head, btns);
    row.append(top);
    if(e.plays.length){
      const list = el("div", "svPlays");
      list.hidden = true;
      for(const p of e.plays){
        const item = el("div", "svPlay");
        const line = el("div");
        line.append(el("span", "when", fmtDate(p.date)),
                    el("span", "sc", (p.success ? "⛳ " + T("sk", p.strokes) : "⏰ " + T("noGoal")) + T("paren", fmtTime(p.time))));
        const rt = el("div", "rt");
        p.route.forEach((st, i) => {
          if(i) rt.append(st.back ? " ↩ " : " → ");
          rt.append(st.back ? el("span", "b", st.title) : st.title);
        });
        item.append(line, rt);
        list.append(item);
      }
      row.append(list);
      head.addEventListener("click", ()=>{ list.hidden = !list.hidden; });
    }
    box.append(row);
  }
}
async function playSaved(e){
  if(state.playing && state.strokes > 0 && !confirm(T("confirmNew"))) return;
  $("savedModal").classList.remove("show");
  $("win").classList.remove("show");
  state.challenge = {start:e.startId, goal:e.goalId, rules:{...DEFAULTS, ...e.rules}, name:"", strokes:null, time:null, saved:true};
  try{ history.replaceState(null, "", challengeUrl({start:e.startId, goal:e.goalId, rules:state.challenge.rules})); }catch(_){}
  await loadChallenge();
}
$("savedBtn").addEventListener("click", ()=>{ renderSaved(); $("savedModal").classList.add("show"); });
$("savedClose").addEventListener("click", ()=> $("savedModal").classList.remove("show"));
$("savedModal").addEventListener("click", e=>{ if(e.target.id === "savedModal") $("savedModal").classList.remove("show"); });
$("clearAll").addEventListener("click", ()=>{
  if(!confirm(T("confirmClearAll"))) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(_){}
  renderSaved(); updateSaveBtn();
});

/* ════════ トースト ════════ */
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ════════ はじまり ════════ */
state.challenge = parseChallenge();
if(state.challenge) loadChallenge(); else newOdai();
